[package]
name = "spotlight-backend"
version = "0.1.0"
edition = "2024"
default-run = "spotlight-backend"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
half = "2"
base64 = "0.22"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
